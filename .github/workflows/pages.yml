name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "test/**"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve tool versions
        id: tools
        run: |
          echo "esbuild=$(jq -r '.devDependencies.esbuild' package.json)" >> "$GITHUB_OUTPUT"
          echo "minifier=$(jq -r '.devDependencies["html-minifier-terser"]' package.json)" >> "$GITHUB_OUTPUT"
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: build-tools-${{ steps.tools.outputs.esbuild }}-${{ steps.tools.outputs.minifier }}
      - name: Install build tools
        run: npm i --prefix .. esbuild@${{ steps.tools.outputs.esbuild }} html-minifier-terser@${{ steps.tools.outputs.minifier }}
      - name: Test
        run: node --test "test/**/*.test.js"
      - name: Build
        run: node scripts/build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
